[package]
name = "fit-parser"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.5.47", features = ["derive"], optional = true }
thiserror = "2.0.16"

[dev-dependencies]
strum = { version = "0.28.0", features = ["derive"] }

[features]
default = []
cli = ["clap"]

[[bin]]
name = "fit-parser"
required-features = ["cli"]
path = "src/bin/main.rs"
