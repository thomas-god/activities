name: App and client tests

on:
  pull_request:
    branches: ["main"]

jobs:
  app-test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test

  client-test:
    name: svelte client test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    env:
      PUBLIC_APP_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
