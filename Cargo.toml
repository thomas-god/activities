[workspace]
resolver = "2"
members = [
    "crates/activities-app",
    "crates/activities-auth",
    "crates/activities-cli",
    "crates/activities-domain",
    "crates/activities-infra",
    "crates/fit-codegen",
    "crates/fit-parser",
]
default-members = ["crates/activities-app"]

[workspace.package]
version = "0.11.6"
edition = "2024"

[workspace.dependencies]
# Internal workspace crates
activities-app = { path = "crates/activities-app" }
activities-auth = { path = "crates/activities-auth" }
activities-cli = { path = "crates/activities-cli" }
activities-domain = { path = "crates/activities-domain" }
activities-infra = { path = "crates/activities-infra" }
fit-parser = { path = "crates/fit-parser" }

# External dependencies shared by the activities-* crates
anyhow = "1.0.99"
argon2 = { version = "0.5.3", features = ["std"] }
assert_approx_eq = "1.1.0"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-test = "21.0.0"
base64 = "0.23.0"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
const-hex = "1.19.1"
cookie = "0.18.1"
cron = "0.17.0"
derive_more = { version = "2.0.1", features = ["full"] }
email_address = "0.2.9"
flate2 = "1.1.2"
handlebars = "6.3.2"
hmac = "0.13.0"
itertools = "0.15"
lettre = { version = "0.11.22", features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls",
    "ring",
    "rustls-platform-verifier",
], default-features = false }
log = "0.4.34"
mockall = "0.15.0"
opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "internal-logs",
] }
opentelemetry-semantic-conventions = "0.33.0"
opentelemetry_sdk = "0.33.0"
rand = "0.10.1"
reqwest = "0.13.4"
roxmltree = "0.21.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "sqlite",
    "chrono",
] }
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.18"
tower = "0.5.2"
tower-http = { version = "0.7.0", features = [
    "compression-br",
    "compression-gzip",
    "cors",
    "fs",
    "trace",
] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "registry"] }
unicode-normalization = "0.1.25"
unicode_categories = "0.1.1"
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zip = { version = "9.0.0", features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"

# Argon2 is intentionally memory-hard and therefore extremely slow when the
# `argon2`/`blake2` crates are compiled without optimizations (the default for
# `cargo test`). Optimize just these crates in the dev profile so the
# password-hashing auth tests stay fast while production keeps the default
# (secure) Argon2 parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
